<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>মুক্তিযোদ্ধা স্টোর — হিসাব সিস্টেম</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f3f7f5;color:#163229}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
header{background:#087f4e;color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:5}
.brand{font-size:23px;font-weight:800}.sub{opacity:.85;font-size:12px;margin-top:3px}
main{padding:14px 14px 84px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid #e1ebe6;border-radius:14px;padding:13px;box-shadow:0 2px 8px #173b2a0b}
.stat b{display:block;font-size:20px;margin-top:5px}.green{color:#087f4e}.red{color:#d83a3a}.orange{color:#b76d00}.muted{color:#6b7d76;font-size:12px}
h2{font-size:18px;margin:5px 0 12px}.section{margin-top:18px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.action{padding:13px 7px;border-radius:12px;background:#eff8f3;color:#087f4e;font-weight:700;text-align:center}
.row{display:flex;gap:8px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select{width:100%;padding:11px;border:1px solid #d6e2dd;border-radius:10px;background:#fff;outline:none}input:focus,select:focus{border-color:#087f4e}
.btn{background:#087f4e;color:#fff;padding:11px 14px;border-radius:10px;font-weight:700}.btn.alt{background:#eaf6f0;color:#087f4e}.btn.red{background:#feecec;color:#c22d2d}
.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid #e3ebe7;border-radius:12px;padding:11px}.item small{color:#718079}.price{font-weight:800}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;background:#fff;border-top:1px solid #dde7e2;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 5px;z-index:6}
.nav{background:none;color:#65756e;font-size:11px;padding:5px}.nav.active{color:#087f4e;font-weight:800}.nav span{display:block;font-size:20px;margin-bottom:2px}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#173229;color:#fff;padding:10px 15px;border-radius:10px;display:none;z-index:30;font-size:13px}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px 4px;border-bottom:1px solid #edf1ef;text-align:left}
.hidden{display:none!important}.pill{padding:4px 8px;border-radius:99px;background:#eff8f3;color:#087f4e;font-size:11px}
@media(min-width:600px){body{padding:20px}.app{border-radius:18px;overflow:hidden;box-shadow:0 10px 40px #173b2a14}}
</style>

<style>.final-banner{background:#fff7df;border:1px solid #f0d58a;color:#6b4b00;border-radius:12px;padding:11px;margin:0 0 12px;font-size:12px}.shopinfo{font-size:11px;opacity:.9;margin-top:4px}</style>
<script>
// Final shop information and multi-unit product examples.
const SHOP_INFO={name:"মুক্তিযোদ্ধা স্টোর",address:"বাংলাবাজার, দোয়ারাবাজার, সুনামগঞ্জ",mobile:"০১৯১৮০৬২৯৬৫"};
</script>

<style>
:root{--primary:#087f4e;--primary2:#0aa765;--gold:#e0ad3d;--ink:#173b2a;--bg:#f4f8f6}
body{background:linear-gradient(180deg,#eef8f3 0,#f7faf8 40%,#f3f6f5 100%)}
header{background:linear-gradient(135deg,#075c39 0%,#087f4e 55%,#12a96b 100%);padding:22px 16px 24px;box-shadow:0 8px 24px #087f4e22;position:relative;overflow:hidden}
header:after{content:"✦  ✦  ✦";position:absolute;right:14px;bottom:8px;color:#ffffff55;font-size:22px;letter-spacing:5px}.brand{font-size:27px;letter-spacing:.2px;text-shadow:0 2px 8px #0002}.sub{font-size:12px;margin-top:5px}
main{padding-top:16px}.hero{position:relative;overflow:hidden;border-radius:20px;padding:20px;margin-bottom:15px;background:linear-gradient(135deg,#fffaf0,#fff2c9);border:1px solid #efd58a;box-shadow:0 8px 25px #8b6a1914}.hero:before{content:"✦";position:absolute;right:18px;top:-12px;font-size:90px;color:#e0ad3d22}.hero-title{font-size:24px;font-weight:900;color:#6a4b05}.hero-sub{font-size:12px;color:#80652a;margin-top:5px}.hero-badge{display:inline-block;margin-top:12px;background:#087f4e;color:#fff;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800}.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section-title h2{margin:0}.stat{border-radius:17px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:45px;height:45px;border-radius:50%;right:-15px;top:-15px;background:#087f4e12}.stat b{font-size:21px}.action{border:1px solid #dcebe4;background:linear-gradient(180deg,#f6fcf9,#eaf7f0);box-shadow:0 5px 14px #173b2a0b;min-height:72px;transition:.15s}.action:active{transform:scale(.97)}
.card{box-shadow:0 5px 18px #173b2a0b}.pill{font-weight:800}.bottom{box-shadow:0 -5px 18px #173b2a0d}.nav.active{color:#087f4e}.invoice-box{background:#fff;border:1px solid #dfe9e4;border-radius:14px;overflow:hidden}.invoice-head{background:linear-gradient(135deg,#075c39,#0aa765);color:#fff;padding:18px;text-align:center}.invoice-shop{font-size:25px;font-weight:900}.invoice-meta{font-size:11px;opacity:.92;margin-top:5px}.invoice-gold{height:4px;background:linear-gradient(90deg,#e0ad3d,#ffe39a,#e0ad3d)}.invoice-body{padding:14px}.invoice-table{width:100%;border-collapse:collapse;font-size:11px}.invoice-table th,.invoice-table td{padding:7px 3px;border-bottom:1px dashed #dfe7e3}.invoice-total{font-size:18px;font-weight:900;color:#087f4e}.print-btn{background:#173b2a;color:#fff}.unit-note{font-size:11px;color:#6b7d76;background:#f4f8f6;border-radius:9px;padding:8px;margin-top:8px}
@media print{body{background:#fff!important}.no-print{display:none!important}.invoice-print{display:block!important}.app>header,.bottom,main{display:none!important}.modal{position:static!important;background:#fff!important;display:block!important}.sheet{max-width:380px!important;margin:0 auto!important;box-shadow:none!important}.invoice-box{border:0!important}.modal.show{display:block!important}}
</style></head>
<body>
<div class="app">
<header><div class="brand">মুক্তিযোদ্ধা স্টোর</div><div class="sub">বাংলাবাজার, দোয়ারাবাজার, সুনামগঞ্জ • ০১৯১৮০৬২৯৬৫</div></header>
<main id="main"></main>
<nav class="bottom">
<button class="nav active" data-page="home"><span>⌂</span>হোম</button>
<button class="nav" data-page="sale"><span>🛒</span>বিক্রি</button>
<button class="nav" data-page="products"><span>📦</span>পণ্য</button>
<button class="nav" data-page="more"><span>☰</span>আরও</button>
</nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY="muktijoddha_store_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 products:[
  {id:1,name:"চাল মিনিকেট",code:"RICE001",unit:"কেজি",stock:250,cost:68,lastPrice:80},
  {id:2,name:"সয়াবিন তেল",code:"OIL001",unit:"লিটার",stock:85,cost:180,lastPrice:210},
  {id:3,name:"মসুর ডাল",code:"DAL001",unit:"কেজি",stock:50,cost:120,lastPrice:140},
  {id:4,name:"চিনি",code:"SUG001",unit:"কেজি",stock:100,cost:125,lastPrice:140}
 ],
 customers:[],sales:[],purchases:[],expenses:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return "৳ "+Number(n||0).toLocaleString("bn-BD",{maximumFractionDigits:2})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function openModal(title,body){document.getElementById("sheet").innerHTML=`<div class="between"><h2>${title}</h2><button class="btn red" onclick="closeModal()">✕</button></div>${body}`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

function totals(){
 let sales=db.sales.reduce((a,x)=>a+x.total,0), purchases=db.purchases.reduce((a,x)=>a+x.total,0), expenses=db.expenses.reduce((a,x)=>a+x.amount,0);
 let grossDue=db.sales.reduce((a,x)=>a+(x.due||0),0);let collected=db.customers.reduce((a,c)=>a+(c.collections||[]).reduce((x,r)=>x+Number(r.amount||0),0),0);let due=Math.max(0,grossDue-collected);
 return {sales,purchases,expenses,due,profit:sales-purchases-expenses}
}
function render(page="home"){
 document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===page));
 let m=document.getElementById("main"); let t=totals();
 if(page==="home")m.innerHTML=home(t);
 if(page==="sale")m.innerHTML=salePage();
 if(page==="products")m.innerHTML=productsPage();
 if(page==="more")m.innerHTML=morePage(t);
}
function home(t){let low=db.products.filter(p=>Number(p.stock||0)<=Number(p.minStock||5));return `
<div class="hero"><div class="hero-title">মুক্তিযোদ্ধা স্টোর</div><div class="hero-sub">বাংলাবাজার, দোয়ারাবাজার, সুনামগঞ্জ • ০১৯১৮০৬২৯৬৫</div><span class="hero-badge">পাইকারি + খুচরা • ডিজিটাল হিসাব</span></div>
<div class="section-title"><h2>আজকের সারাংশ</h2><span class="pill">স্মার্ট ড্যাশবোর্ড</span></div>
<div class="grid">
 <div class="card stat"><span class="muted">মোট বিক্রি</span><b class="green">${money(t.sales)}</b></div>
 <div class="card stat"><span class="muted">মোট ক্রয়</span><b>${money(t.purchases)}</b></div>
 <div class="card stat"><span class="muted">মোট বাকি</span><b class="red">${money(t.due)}</b></div>
 <div class="card stat"><span class="muted">আনুমানিক লাভ</span><b class="green">${money(t.profit)}</b></div>
</div>
<div class="section-title"><h2>দ্রুত কাজ</h2></div><div class="actions">
 <button class="action" onclick="go('sale')">🛒<br>নতুন বিক্রি</button>
 <button class="action" onclick="invoiceList()">🧾<br>Invoice</button>
 <button class="action" onclick="go('products');setTimeout(addProduct,50)">📦<br>পণ্য যোগ</button>
 <button class="action" onclick="go('more');setTimeout(addPurchase,50)">🚚<br>নতুন ক্রয়</button>
 <button class="action" onclick="go('more');setTimeout(addCustomer,50)">👤<br>কাস্টমার</button>
 <button class="action" onclick="go('more');setTimeout(addCollection,50)">💵<br>বাকি আদায়</button>
 <button class="action" onclick="go('more');setTimeout(report,50)">📊<br>রিপোর্ট</button>
</div>
${low.length?`<div class="section"><div class="section-title"><h2>⚠️ কম স্টক</h2><span class="pill">${low.length}টি</span></div><div class="list">${low.slice(0,5).map(p=>`<div class="item between"><div><b>${esc(p.name)}</b><br><small>${esc(p.unit)}</small></div><b class="orange">${p.stock} ${esc(p.unit)}</b></div>`).join('')}</div></div>`:''}
<div class="section"><div class="section-title"><h2>সাম্প্রতিক বিক্রি</h2></div>${db.sales.length?`<div class="list">${db.sales.slice(-5).reverse().map(s=>`<div class="item between"><div><b>${esc(s.customer||"খুচরা কাস্টমার")}</b><br><small>${s.items.length}টি পণ্য • ${s.payment}</small></div><b class="green">${money(s.total)}</b></div>`).join('')}</div>`:`<div class="card muted">এখনো কোনো বিক্রির হিসাব নেই।</div>`}</div>`}
function salePage(){
 let rows=window.cart||[];
 return `<div class="between"><h2>নতুন বিক্রি</h2><button class="btn alt" onclick="clearCart()">নতুন</button></div>
 <div class="card"><input id="searchSale" placeholder="পণ্যের নাম/কোড লিখুন" oninput="searchProducts()"><div id="saleSearch" class="list" style="margin-top:8px"></div></div>
 <div class="section"><h2>বিক্রির তালিকা</h2><div id="cart">${cartHtml(rows)}</div></div>
 <div class="card"><div class="between"><b>সর্বমোট</b><b class="green" id="saleTotal">${money(rows.reduce((a,x)=>a+x.qty*x.price,0))}</b></div>
 <div class="row" style="margin-top:10px"><input id="customerName" placeholder="কাস্টমারের নাম (ঐচ্ছিক)"><select id="pay"><option>নগদ</option><option>বাকি</option><option>আংশিক পরিশোধ</option></select></div>
 <button class="btn" style="width:100%;margin-top:10px" onclick="finishSale()">বিক্রি সম্পন্ন করুন</button></div>`;
}
function cartHtml(rows){if(!rows.length)return `<div class="card muted">পণ্য যোগ করুন। প্রতিটি পণ্যের দাম এখানে পরিবর্তন করতে পারবেন।</div>`;
 return rows.map((x,i)=>`<div class="item"><div class="between"><b>${esc(x.name)}</b><button class="btn red" onclick="removeCart(${i})">✕</button></div>
 <div class="row" style="margin-top:8px"><input type="number" min="0.01" value="${x.qty}" onchange="editCart(${i},'qty',this.value)" placeholder="পরিমাণ"><select onchange="editCartUnit(${i},this.value)"><option value="base" ${x.saleUnit==='base'?"selected":""}>${esc(x.unit)}</option>${x.pack?`<option value="pack" ${x.saleUnit==='pack'?"selected":""}>${esc(x.pack)}</option>`:""}</select><input type="number" min="0" value="${x.price}" onchange="editCart(${i},'price',this.value)" placeholder="দাম"><b>${money(x.qty*x.price)}</b></div><small>${x.saleUnit==='pack'&&x.conv?`১ ${esc(x.pack)} = ${x.conv} ${esc(x.unit)}`:esc(x.unit)}</small></div>`).join("")}
function searchProducts(){let q=document.getElementById("searchSale").value.toLowerCase();let out=db.products.filter(p=>(p.name+" "+(p.brand||"")+" "+(p.size||"")+" "+p.code).toLowerCase().includes(q)).slice(0,8).map(p=>`<button class="item" style="text-align:left;background:#fff" onclick="addCart(${p.id})"><div class="between"><b>${esc(p.name)}${p.brand?" — "+esc(p.brand):""} ${p.size?"("+esc(p.size)+")":""}</b><span class="pill">স্টক ${p.stock} ${esc(p.unit)}</span></div><small>${p.code||""} • ${p.pack?`১ ${esc(p.pack)} = ${p.conv} ${esc(p.unit)} • `:""}সর্বশেষ ${money(p.lastPrice)}/${esc(p.unit)}</small></button>`).join("");document.getElementById("saleSearch").innerHTML=out}
function addCart(id){let p=db.products.find(x=>x.id===id);window.cart=window.cart||[];let x=window.cart.find(x=>x.id===id);if(x)x.qty++;else window.cart.push({id:p.id,name:p.name,brand:p.brand,size:p.size,unit:p.unit,pack:p.pack,conv:p.conv||1,qty:1,price:p.lastPrice,saleUnit:"base"});render("sale");setTimeout(()=>{document.getElementById("searchSale").focus();searchProducts()},0)}
function editCart(i,k,v){window.cart[i][k]=Number(v);render("sale")}
function editCartUnit(i,v){let x=window.cart[i];if(v==="pack"){x.saleUnit="pack";x.qty=1;x.price=(x.price||0)*(x.conv||1)}else{x.saleUnit="base";x.qty=1;x.price=(x.price||0)/(x.conv||1)}render("sale")}
function removeCart(i){window.cart.splice(i,1);render("sale")}
function clearCart(){window.cart=[];render("sale")}
function finishSale(){
 let rows=window.cart||[];if(!rows.length)return toast("আগে পণ্য যোগ করুন");
 let total=rows.reduce((a,x)=>a+x.qty*x.price,0), pay=document.getElementById("pay").value, customer=document.getElementById("customerName").value.trim();
 let paid=pay==="নগদ"?total:pay==="বাকি"?0:Number(prompt("কত টাকা পেয়েছেন?",total)||0); if(paid<0||paid>total)return toast("টাকার পরিমাণ ঠিক নয়");
 rows.forEach(x=>{let p=db.products.find(p=>p.id===x.id);let used=x.saleUnit==='pack'?(x.qty*(x.conv||1)):x.qty;p.stock-=used;p.lastPrice=x.saleUnit==='pack'?x.price/(x.conv||1):x.price});
 let due=total-paid;db.sales.push({id:Date.now(),date:new Date().toISOString(),customer,total,paid,due,payment:pay,items:rows.map(x=>({...x}))});save();window.cart=[];showInvoice(db.sales[db.sales.length-1]);
}
function showInvoice(s){let rows=s.items||[];openModal("ইনভয়েস",`<div class="invoice-box" id="invoicePrint"><div class="invoice-head"><div class="invoice-shop">${esc(SHOP_INFO.name)}</div><div class="invoice-meta">${esc(SHOP_INFO.address)}<br>মোবাইল: ${esc(SHOP_INFO.mobile)}</div></div><div class="invoice-gold"></div><div class="invoice-body"><div class="between"><span>ইনভয়েস: #${String(s.id).slice(-6)}</span><span>${new Date(s.date).toLocaleDateString('bn-BD')}</span></div><div style="margin:10px 0;font-size:12px">কাস্টমার: <b>${esc(s.customer||'খুচরা কাস্টমার')}</b></div><table class="invoice-table"><tr><th>পণ্য</th><th>পরিমাণ</th><th>দাম</th><th>মোট</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.saleUnit==='pack'?(x.pack||x.unit):x.unit)}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</table><div style="margin-top:12px;text-align:right"><div>সর্বমোট: <span class="invoice-total">${money(s.total)}</span></div><div style="font-size:12px;margin-top:4px">পরিশোধ: ${money(s.paid)} • বাকি: ${money(s.due)}</div></div><div style="text-align:center;font-size:11px;color:#6b7d76;margin-top:18px">মুক্তিযোদ্ধা স্টোরে কেনাকাটার জন্য ধন্যবাদ ❤️</div></div></div><div class="row no-print" style="margin-top:10px"><button class="btn print-btn" style="flex:1" onclick="window.print()">🖨️ ইনভয়েস প্রিন্ট</button><button class="btn alt" style="flex:1" onclick="closeModal();render('home')">বন্ধ</button></div>`)}
function invoiceList(){let q=(prompt("Invoice নম্বর বা কাস্টমারের নাম লিখুন (ফাঁকা রাখলে সব Invoice)","")||"").toLowerCase();let arr=db.sales.slice().reverse().filter(s=>!q||String(s.id).slice(-6).includes(q)||String(s.customer||"খুচরা কাস্টমার").toLowerCase().includes(q));openModal("🧾 Invoice তালিকা",`<div class="list">${arr.map(s=>`<div class="item"><div class="between"><div><b>Invoice #${String(s.id).slice(-6)}</b><br><small>${esc(s.customer||"খুচরা কাস্টমার")} • ${new Date(s.date).toLocaleDateString('bn-BD')}</small></div><b class="green">${money(s.total)}</b></div><button class="btn alt" style="width:100%;margin-top:8px" onclick='showInvoice(${JSON.stringify(s).replace(/'/g,"&#39;")})'>👁️ দেখুন / 🖨️ Print</button></div>`).join("")||`<div class="card muted">কোনো Invoice পাওয়া যায়নি।</div>`}</div>`)}
function downloadProductTemplate(){let csv='name,brand,size,unit,pack,conv,code,stock,minStock,cost,lastPrice\nচাল মিনিকেট,Fresh,25kg,কেজি,বস্তা,25,RICE001,0,10,68,80\nসয়াবিন তেল,Fresh,1L,লিটার,কার্টুন,24,OIL001,0,24,180,210\nটিন তেল,Fresh,16kg,টিন,,1,OIL-TIN,0,2,2500,2700\n';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='muktijoddha_products_template.csv';a.click();toast('পণ্যের Template ডাউনলোড হয়েছে')}
function importProductsFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let lines=r.result.replace(/^\uFEFF/,'').trim().split(/\r?\n/);let head=lines.shift().split(',').map(x=>x.trim());let idx=k=>head.indexOf(k);let added=0;lines.forEach(line=>{let a=line.split(',');if(!a[idx('name')])return;let o={id:Date.now()+Math.random(),name:a[idx('name')].trim(),brand:a[idx('brand')]?.trim()||'',size:a[idx('size')]?.trim()||'',unit:a[idx('unit')]?.trim()||'পিস',pack:a[idx('pack')]?.trim()||'',conv:Number(a[idx('conv')])||1,code:a[idx('code')]?.trim()||'',stock:Number(a[idx('stock')])||0,minStock:Number(a[idx('minStock')])||5,cost:Number(a[idx('cost')])||0,lastPrice:Number(a[idx('lastPrice')])||0};db.products.push(o);added++});save();closeModal();render('products');toast(added+'টি পণ্য যোগ হয়েছে')}catch(err){toast('CSV ফাইলের ফরম্যাট ঠিক নয়')}};r.readAsText(f,'UTF-8')}
function bulkProductImport(){openModal('📥 অনেক পণ্য একসাথে যোগ করুন',`<div class="final-banner"><b>এক এক করে পণ্য যোগ করার দরকার নেই।</b><br>Template ডাউনলোড করে Excel/Google Sheets-এ পণ্যের নাম, ইউনিট, দাম ইত্যাদি লিখে CSV হিসেবে Upload করুন।</div><button class="btn alt" style="width:100%;margin:8px 0" onclick="downloadProductTemplate()">⬇️ CSV Template ডাউনলোড</button><input type="file" accept=".csv,text/csv" onchange="importProductsFile(event)"><div class="unit-note">Unit-এ আপনার পছন্দের যেকোনো নাম লিখতে পারবেন। pack ও conv দিলে প্যাকেজ হিসাবও হবে।</div>`)}
function productsPage(){return `<div class="between"><h2>পণ্য ও স্টক</h2><div class="row"><button class="btn alt" onclick="bulkProductImport()">📥 Bulk</button><button class="btn" onclick="addProduct()">+ পণ্য</button></div></div>
<input id="productSearch" placeholder="পণ্যের নাম/কোড খুঁজুন" oninput="renderProducts()" style="margin-bottom:10px"><div id="productList" class="list">${productRows()}</div>`}
function productRows(){let q=(document.getElementById("productSearch")?.value||"").toLowerCase();return db.products.filter(p=>(p.name+" "+(p.brand||"")+" "+(p.size||"")+" "+p.code).toLowerCase().includes(q)).map(p=>{let packs=p.pack?Math.floor(p.stock/(p.conv||1)):0;let loose=p.pack?p.stock%(p.conv||1):p.stock;return `<div class="item"><div class="between"><div><b>${esc(p.name)}${p.brand?" — "+esc(p.brand):""}</b><br><small>${esc(p.size||"")} • ${esc(p.code||"")}</small></div><span class="pill">${p.stock} ${esc(p.unit)}</span></div><div style="margin-top:7px" class="muted">${p.pack?`স্টক: ${packs} ${esc(p.pack)} + ${loose} ${esc(p.unit)} • ১ ${esc(p.pack)} = ${p.conv} ${esc(p.unit)}`:"বেস ইউনিটে স্টক"}</div><div class="between" style="margin-top:8px"><small>ক্রয় ${money(p.cost)}/${esc(p.unit)} • সর্বশেষ ${money(p.lastPrice)}/${esc(p.unit)}</small><button class="btn alt" onclick="editProduct(${p.id})">এডিট</button></div></div>`}).join("")||`<div class="card muted">কোনো পণ্য পাওয়া যায়নি।</div>`}
function renderProducts(){document.getElementById("productList").innerHTML=productRows()}

function commonProductOptions(){return `<option value="">— কমন পণ্য নির্বাচন করুন —</option>`+COMMON_GROCERY.map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join('')}
function applyCommonProduct(){let i=Number(document.getElementById('commonProduct')?.value);if(Number.isNaN(i)||!COMMON_GROCERY[i])return;let x=COMMON_GROCERY[i];document.getElementById('pn').value=x[0];document.getElementById('psize').value='';document.getElementById('pb').value='';}
function addProduct(p=null){let u=(p?.unit||'');openModal(p?"পণ্য সম্পাদনা":"নতুন পণ্য",`<div class="final-banner"><b>🛒 কমন মুদি পণ্য তালিকা</b><br>এখানে শুধু পণ্যের নাম থাকবে। Brand, Unit, Pack, Conversion, দাম ও স্টক—সব আপনি নিজে ঠিক করবেন।</div><select id="commonProduct" onchange="applyCommonProduct()">${commonProductOptions()}</select><br><br><input id="pn" placeholder="পণ্যের নাম" value="${esc(p?.name||'')}"><br><br><input id="pb" placeholder="ব্র্যান্ড — নিজের মতো লিখুন" value="${esc(p?.brand||'')}"><br><br><input id="psize" placeholder="সাইজ (যেমন 500ml / 1L / 25kg)" value="${esc(p?.size||'')}"><br><br><label class="muted">বেজ ইউনিট</label><input id="pu" list="unitSuggestions" placeholder="যেকোনো ইউনিট লিখুন: কেজি/বস্তা/কার্টুন/টিন/পিস..." value="${esc(u)}"><datalist id="unitSuggestions"><option value="কেজি"><option value="গ্রাম"><option value="লিটার"><option value="মিলিলিটার"><option value="বস্তা"><option value="কার্টুন"><option value="টিন"><option value="পিস"><option value="বোতল"><option value="প্যাকেট"><option value="বক্স"><option value="ডজন"><option value="জোড়া"></datalist><br><input id="pack" placeholder="প্যাক/বড় ইউনিট (ঐচ্ছিক)" value="${esc(p?.pack||'')}"><br><br><input id="conv" type="number" min="0.0001" step="0.01" placeholder="১ প্যাকে কত বেজ ইউনিট?" value="${p?.conv??1}"><div class="unit-note">উদাহরণ: বেজ ইউনিট কেজি, প্যাক বস্তা, Conversion 25 → ১ বস্তা = ২৫ কেজি। প্যাক না লাগলে ফাঁকা রাখুন।</div><br><input id="pc" placeholder="পণ্য কোড / SKU (ঐচ্ছিক)" value="${esc(p?.code||'')}"><br><br><input id="ps" type="number" step="0.01" placeholder="বর্তমান স্টক (বেজ ইউনিট)" value="${p?.stock??0}"><br><br><input id="pmin" type="number" step="0.01" placeholder="কম স্টক সতর্কতা সীমা" value="${p?.minStock??5}"><br><br><input id="pcost" type="number" step="0.01" placeholder="ক্রয়মূল্য / বেজ ইউনিট" value="${p?.cost??0}"><br><br><input id="pl" type="number" step="0.01" placeholder="সর্বশেষ বিক্রয়মূল্য / বেজ ইউনিট" value="${p?.lastPrice??0}"><br><br><button class="btn" style="width:100%" onclick="saveProduct(${p?.id||0})">সংরক্ষণ</button>`)}
function saveProduct(id){let unit=pu.value.trim();let o={name:pn.value.trim(),brand:pb.value.trim(),size:psize.value.trim(),unit,pack:pack.value.trim(),conv:Number(conv.value)||1,code:pc.value.trim(),stock:Number(ps.value)||0,minStock:Number(pmin.value)||5,cost:Number(pcost.value)||0,lastPrice:Number(pl.value)||0};if(!o.name||!o.unit)return toast("পণ্যের নাম ও বেজ ইউনিট দিন");if(id){Object.assign(db.products.find(p=>p.id===id),o)}else{db.products.push({id:Date.now(),...o})}save();closeModal();render("products");toast("পণ্য সংরক্ষণ হয়েছে")}
function editProduct(id){addProduct(db.products.find(p=>p.id===id))}

function morePage(t){return `<div class="actions">
<button class="action" onclick="customers()">👥<br>কাস্টমার/বাকি</button><button class="action" onclick="addCollection()">💵<br>বাকি আদায়</button>
<button class="action" onclick="addPurchase()">🚚<br>ক্রয়</button>
<button class="action" onclick="addExpense()">💸<br>খরচ</button>
<button class="action" onclick="report()">📊<br>রিপোর্ট</button>
<button class="action" onclick="backup()">💾<br>ব্যাকআপ</button>
<button class="action" onclick="restore()">♻️<br>ডেটা ফেরত</button>
</div>
<div class="section"><h2>সিস্টেম</h2><div class="card"><div class="between"><span>মোট পণ্য</span><b>${db.products.length}</b></div><div class="between"><span>মোট বিক্রির রেকর্ড</span><b>${db.sales.length}</b></div><div class="between"><span>মোট ক্রয়ের রেকর্ড</span><b>${db.purchases.length}</b></div></div></div>`}
function addCustomer(){openModal("নতুন কাস্টমার",`<input id="cn" placeholder="কাস্টমারের নাম"><br><br><input id="cm" placeholder="মোবাইল নম্বর"><br><br><input id="ca" placeholder="ঠিকানা"><br><br><button class="btn" style="width:100%" onclick="saveCustomer()">সংরক্ষণ</button>`)}
function saveCustomer(){let name=cn.value.trim();if(!name)return toast("নাম দিন");db.customers.push({id:Date.now(),name,mobile:cm.value.trim(),address:ca.value.trim(),collections:[]});save();closeModal();toast("কাস্টমার যোগ হয়েছে")}
function customers(){openModal("কাস্টমার ও বাকি",`<input id="cq" placeholder="কাস্টমার খুঁজুন" oninput="customerRows()"><div id="customerRows" class="list" style="margin-top:10px">${customerRows()}</div><button class="btn" style="width:100%;margin-top:10px" onclick="addCustomer()">+ নতুন কাস্টমার</button>`)}
function customerRows(){let q=(document.getElementById("cq")?.value||"").toLowerCase();let names=[...db.customers];db.sales.forEach(s=>{if(s.customer&&!names.some(c=>c.name===s.customer))names.push({name:s.customer,mobile:"",address:"",collections:[]})});let el=document.getElementById("customerRows");let html=names.filter(c=>c.name.toLowerCase().includes(q)).map(c=>{let salesDue=db.sales.filter(s=>s.customer===c.name).reduce((a,s)=>a+Number(s.due||0),0);let collected=(c.collections||[]).reduce((a,r)=>a+Number(r.amount||0),0);let due=Math.max(0,salesDue-collected);return `<div class="item"><div class="between"><div><b>${esc(c.name)}</b><br><small>${c.mobile||"মোবাইল নেই"}${c.address?` • ${esc(c.address)}`:""}</small></div><b class="red">${money(due)}</b></div>${collected?`<small class="muted">মোট আদায়: ${money(collected)}</small>`:''}</div>`}).join("")||`<div class="muted">কোনো কাস্টমার নেই</div>`;if(el)el.innerHTML=html;return html}
function addPurchase(){openModal("নতুন ক্রয়",`<input id="sup" placeholder="সরবরাহকারী"><br><br><select id="pp" onchange="purchaseUnitInfo()">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — বেজ: ${esc(p.unit)}</option>`).join("")}</select><br><br><div id="purchaseUnitInfo" class="unit-note"></div><br><select id="punit"><option value="base">বেজ ইউনিট</option><option value="pack">প্যাকেজ ইউনিট</option></select><br><br><input id="pq" type="number" step="0.01" placeholder="পরিমাণ"><br><br><input id="pprice" type="number" step="0.01" placeholder="ক্রয়মূল্য (নির্বাচিত ইউনিট অনুযায়ী)"><br><br><select id="pPay"><option>নগদ</option><option>বাকি</option></select><br><br><button class="btn" style="width:100%" onclick="savePurchase()">ক্রয় সংরক্ষণ</button>`);purchaseUnitInfo()}
function purchaseUnitInfo(){let p=db.products.find(x=>x.id===Number(pp.value));let el=document.getElementById('purchaseUnitInfo');if(!p||!el)return;el.innerHTML=p.pack?`বেজ ইউনিট: <b>${esc(p.unit)}</b> • ১ ${esc(p.pack)} = <b>${p.conv||1} ${esc(p.unit)}</b>`:`বেজ ইউনিট: <b>${esc(p.unit)}</b> — প্যাকেজ সেট করা নেই`}
function savePurchase(){let p=db.products.find(x=>x.id===Number(pp.value)),qty=Number(pq.value),price=Number(pprice.value),isPack=punit.value==='pack';if(!p||qty<=0||price<0)return toast("তথ্য ঠিকভাবে দিন");let conv=isPack?(Number(p.conv)||1):1;let baseQty=qty*conv;let basePrice=price/conv;p.stock=(Number(p.stock)||0)+baseQty;p.cost=basePrice;db.purchases.push({id:Date.now(),supplier:sup.value.trim(),product:p.name,qty,unit:isPack?(p.pack||p.unit):p.unit,baseQty,price,total:qty*price,payment:pPay.value,date:new Date().toISOString()});save();closeModal();toast(`ক্রয় সংরক্ষণ হয়েছে • স্টকে +${baseQty} ${p.unit}`)}
function addCollection(){let names=db.customers.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');openModal("বাকি টাকা আদায়",`<select id="colCustomer">${names||'<option value="">কাস্টমার নেই</option>'}</select><br><br><input id="colAmount" type="number" step="0.01" placeholder="আদায়ের টাকা"><br><br><input id="colNote" placeholder="নোট (ঐচ্ছিক)"><br><br><button class="btn" style="width:100%" onclick="saveCollection()">আদায় সংরক্ষণ</button>`)}
function saveCollection(){let name=colCustomer.value,amount=Number(colAmount.value);if(!name||amount<=0)return toast('কাস্টমার ও টাকার পরিমাণ দিন');let c=db.customers.find(x=>x.name===name);c.collections=c.collections||[];c.collections.push({id:Date.now(),amount,note:colNote.value.trim(),date:new Date().toISOString()});save();closeModal();toast('বাকি আদায় সংরক্ষণ হয়েছে')}
function addExpense(){openModal("নতুন খরচ",`<select id="et"><option>পরিবহন</option><option>বিদ্যুৎ</option><option>ভাড়া</option><option>শ্রমিক</option><option>অন্যান্য</option></select><br><br><input id="ea" type="number" placeholder="টাকার পরিমাণ"><br><br><input id="en" placeholder="নোট"><br><br><button class="btn" style="width:100%" onclick="saveExpense()">খরচ সংরক্ষণ</button>`)}
function saveExpense(){let amount=Number(ea.value);if(amount<=0)return toast("টাকার পরিমাণ দিন");db.expenses.push({id:Date.now(),type:et.value,amount,note:en.value.trim(),date:new Date().toISOString()});save();closeModal();toast("খরচ সংরক্ষণ হয়েছে")}
function report(){let t=totals();openModal("রিপোর্ট",`<div class="grid"><div class="card stat"><span class="muted">বিক্রি</span><b>${money(t.sales)}</b></div><div class="card stat"><span class="muted">ক্রয়</span><b>${money(t.purchases)}</b></div><div class="card stat"><span class="muted">খরচ</span><b>${money(t.expenses)}</b></div><div class="card stat"><span class="muted">আনুমানিক লাভ</span><b class="green">${money(t.profit)}</b></div></div><div class="section"><b>স্টক সংক্ষিপ্ত তালিকা</b><table class="table"><tr><th>পণ্য</th><th>স্টক</th><th>মূল্য</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock} ${p.unit}</td><td>${money(p.cost*p.stock)}</td></tr>`).join("")}</table></div>`)}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="muktijoddha-store-backup.json";a.click();toast("ব্যাকআপ ফাইল তৈরি হয়েছে")}
function restore(){openModal("ডেটা ফেরত আনুন",`<p class="muted">আগের ব্যাকআপ JSON ফাইল নির্বাচন করুন।</p><input id="file" type="file" accept=".json" onchange="readBackup(event)">`)}
function readBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();closeModal();render("home");toast("ব্যাকআপ সফলভাবে ফিরেছে")}catch{toast("ফাইলটি সঠিক নয়")}};r.readAsText(f)}
function go(p){render(p)}
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>render(n.dataset.page));
window.cart=[];render("home");
</script>
</body>
</html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>মুক্তিযোদ্ধা স্টোর — হিসাব সিস্টেম</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#087f4e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="মুক্তিযোদ্ধা স্টোর"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f3f7f5;color:#163229}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}header{background:#087f4e;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}.brand{font-size:23px;font-weight:800}.sub{font-size:12px;opacity:.9}main{padding:14px 14px 84px}.card{background:#fff;border:1px solid #e1ebe6;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px #173b2a0b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:20px;margin-top:5px}.green{color:#087f4e}.red{color:#d83a3a}.muted{color:#6b7d76;font-size:12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{padding:13px 7px;border-radius:12px;background:#eff8f3;color:#087f4e;font-weight:700}.btn{background:#087f4e;color:#fff;padding:11px 14px;border:0;border-radius:10px;font-weight:700}.btn.alt{background:#eaf6f0;color:#087f4e}input,select{width:100%;padding:11px;border:1px solid #d6e2dd;border-radius:10px;font:inherit}.row,.between{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.item{border:1px solid #e3ebe7;border-radius:12px;padding:11px;margin:8px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;background:#fff;border-top:1px solid #dde7e2;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 5px;z-index:6}.nav{background:none;border:0;color:#65756e;font-size:11px;padding:5px}.nav.active{color:#087f4e;font-weight:800}.nav span{display:block;font-size:20px}.modal{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#173229;color:#fff;padding:10px 15px;border-radius:10px;display:none;z-index:30}</style></head><body><div class="app"><header><div class="brand">মুক্তিযোদ্ধা স্টোর</div><div class="sub">বাংলাবাজার, দোয়ারাবাজার, সুনামগঞ্জ • ০১৯১৮০৬২৯৬৫</div></header><main id="main"></main><nav class="bottom"><button class="nav active" data-page="home"><span>⌂</span>হোম</button><button class="nav" data-page="sale"><span>🛒</span>বিক্রি</button><button class="nav" data-page="products"><span>📦</span>পণ্য</button><button class="nav" data-page="more"><span>☰</span>আরও</button></nav></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div><script>const KEY='muktijoddha_store_v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{products:[{id:1,name:'চাল মিনিকেট',code:'RICE001',unit:'কেজি',stock:250,cost:68,lastPrice:80},{id:2,name:'সয়াবিন তেল',code:'OIL001',unit:'লিটার',stock:85,cost:180,lastPrice:210},{id:3,name:'মসুর ডাল',code:'DAL001',unit:'কেজি',stock:50,cost:120,lastPrice:140},{id:4,name:'চিনি',code:'SUG001',unit:'কেজি',stock:100,cost:125,lastPrice:140}],customers:[],suppliers:[],supplierPayments:[],sales:[],purchases:[],expenses:[]};function save(){localStorage.setItem(KEY,JSON.stringify(db))}function money(n){return '৳ '+Number(n||0).toLocaleString('bn-BD',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}function go(p){render(p)}function totals(){let sales=db.sales.reduce((a,x)=>a+x.total,0),purchases=db.purchases.reduce((a,x)=>a+x.total,0),expenses=db.expenses.reduce((a,x)=>a+x.amount,0),due=db.sales.reduce((a,x)=>a+(x.due||0),0);return{sales,purchases,expenses,due,profit:sales-purchases-expenses}}function render(page='home'){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));let m=document.getElementById('main'),t=totals();m.innerHTML=page==='home'?home(t):page==='products'?productsPage():page==='sale'?salePage():morePage(t)}function home(t){return `<div class="card"><b>মুক্তিযোদ্ধা স্টোর</b><br><span class="muted">বাংলাবাজার, দোয়ারাবাজার, সুনামগঞ্জ<br>মোবাইল: ০১৯১৮০৬২৯৬৫</span></div><h2>আজকের সারাংশ</h2><div class="grid"><div class="card stat"><span class="muted">মোট বিক্রি</span><b class="green">${money(t.sales)}</b></div><div class="card stat"><span class="muted">মোট ক্রয়</span><b>${money(t.purchases)}</b></div><div class="card stat"><span class="muted">মোট বাকি</span><b class="red">${money(t.due)}</b></div><div class="card stat"><span class="muted">আনুমানিক লাভ</span><b class="green">${money(t.profit)}</b></div></div><h2>দ্রুত কাজ</h2><div class="actions"><button class="action" onclick="go('sale')">🛒<br>নতুন বিক্রি</button><button class="action" onclick="addProduct()">➕<br>পণ্য যোগ</button><button class="action" onclick="addCustomer()">👤<br>কাস্টমার</button><button class="action" onclick="addExpense()">💸<br>খরচ</button><button class="action" onclick="addPurchase()">🚚<br>ক্রয়</button><button class="action" onclick="report()">📊<br>রিপোর্ট</button></div>`}function productsPage(){return `<div class="between"><h2>পণ্য ও স্টক</h2><button class="btn" onclick="addProduct()">+ পণ্য</button></div><div class="card">${db.products.map(p=>`<div class="item"><div class="between"><b>${esc(p.name)}</b><b class="green">${p.stock} ${esc(p.unit)}</b></div><small>${esc(p.code)} • ক্রয় ${money(p.cost)} • বিক্রয় ${money(p.lastPrice)}</small><br><button class="btn alt" style="margin-top:8px" onclick="addProduct(${p.id})">এডিট</button></div>`).join('')}</div>`}let cart=[];function salePage(){return `<h2>নতুন বিক্রি</h2><div class="card"><input id="sq" placeholder="পণ্যের নাম/কোড লিখুন" oninput="searchSale()"><div id="sr"></div></div><div class="card"><b>বিক্রির তালিকা</b><div id="cart">${cart.map((x,i)=>`<div class="item"><div class="between"><b>${esc(x.name)}</b><button class="btn alt" onclick="cart.splice(${i},1);render('sale')">✕</button></div><div class="row"><input type="number" value="${x.qty}" min="1" onchange="cart[${i}].qty=Number(this.value);render('sale')"><input type="number" value="${x.price}" min="0" onchange="cart[${i}].price=Number(this.value);render('sale')"></div></div>`).join('')}</div><h3>মোট: ${money(cart.reduce((a,x)=>a+x.qty*x.price,0))}</h3><input id="customer" placeholder="কাস্টমারের নাম"><button class="btn" style="width:100%;margin-top:10px" onclick="finishSale()">বিক্রি সম্পন্ন করুন</button></div>`}function searchSale(){let q=(document.getElementById('sq').value||'').toLowerCase();document.getElementById('sr').innerHTML=db.products.filter(p=>(p.name+' '+p.code).toLowerCase().includes(q)).slice(0,8).map(p=>`<button class="item" style="width:100%;text-align:left;background:#fff" onclick="cart.push({id:${p.id},name:'${p.name.replace(/'/g,"\\'")}',qty:1,price:${p.lastPrice}});render('sale')"><b>${esc(p.name)}</b><br><small>স্টক ${p.stock} ${esc(p.unit)} • ${money(p.lastPrice)}</small></button>`).join('')}function finishSale(){if(!cart.length)return toast('আগে পণ্য যোগ করুন');let total=cart.reduce((a,x)=>a+x.qty*x.price,0);for(let x of cart){let p=db.products.find(p=>p.id===x.id);if(x.qty>p.stock)return toast('স্টক পর্যাপ্ত নেই: '+p.name);p.stock-=x.qty;p.lastPrice=x.price}let customer=document.getElementById('customer').value.trim()||'খুচরা কাস্টমার';db.sales.push({id:Date.now(),date:new Date().toISOString(),customer,total,paid:total,due:0,payment:'নগদ',items:cart.map(x=>({...x}))});save();cart=[];toast('বিক্রি সংরক্ষণ হয়েছে');go('home')}function morePage(t){return `<h2>আরও</h2><div class="actions"><button class="action" onclick="customers()">👥<br>কাস্টমার</button><button class="action" onclick="suppliers()">🏢<br>পার্টি</button><button class="action" onclick="addPurchase()">🚚<br>ক্রয়</button><button class="action" onclick="addExpense()">💸<br>খরচ</button><button class="action" onclick="report()">📊<br>রিপোর্ট</button><button class="action" onclick="backup()">💾<br>ব্যাকআপ</button></div>`}function modal(title,body){document.getElementById('sheet').innerHTML=`<div class="between"><h2>${title}</h2><button class="btn" onclick="closeModal()">✕</button></div>${body}`;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function addProduct(id){let p=id?db.products.find(x=>x.id===id):null;modal(p?'পণ্য এডিট':'নতুন পণ্য',`<input id="pn" placeholder="পণ্যের নাম" value="${esc(p?.name||'')}"><br><br><input id="pu" placeholder="ইউনিট" value="${esc(p?.unit||'')}"><br><br><input id="ps" type="number" placeholder="স্টক" value="${p?.stock??0}"><br><br><input id="pc" type="number" placeholder="ক্রয়মূল্য" value="${p?.cost??0}"><br><br><input id="pl" type="number" placeholder="বিক্রয়মূল্য" value="${p?.lastPrice??0}"><br><br><button class="btn" style="width:100%" onclick="saveProduct(${id||0})">সংরক্ষণ</button>`)}function saveProduct(id){let o={name:pn.value.trim(),unit:pu.value.trim(),stock:Number(ps.value)||0,cost:Number(pc.value)||0,lastPrice:Number(pl.value)||0,code:id?(db.products.find(x=>x.id===id)?.code||''):'P'+Date.now()};if(!o.name||!o.unit)return toast('নাম ও ইউনিট দিন');if(id)Object.assign(db.products.find(x=>x.id===id),o);else db.products.push({id:Date.now(),...o});save();closeModal();render('products');toast('পণ্য সংরক্ষণ হয়েছে')}function addCustomer(){modal('নতুন কাস্টমার',`<input id="cn" placeholder="কাস্টমারের নাম"><br><br><input id="cm" placeholder="মোবাইল নম্বর"><br><br><input id="ca" placeholder="ঠিকানা"><br><br><button class="btn" style="width:100%" onclick="db.customers.push({id:Date.now(),name:cn.value,mobile:cm.value,address:ca.value});save();closeModal();toast('কাস্টমার যোগ হয়েছে')">সংরক্ষণ</button>`)}function customers(){modal('কাস্টমার ও বাকি',db.customers.map(c=>`<div class="item"><b>${esc(c.name)}</b><br><small>${esc(c.mobile||'')} ${esc(c.address||'')}</small></div>`).join('')+`<button class="btn" onclick="addCustomer()">+ নতুন কাস্টমার</button>`)}function suppliers(){modal('পার্টি / সরবরাহকারী',db.suppliers.map(s=>`<div class="item"><b>${esc(s.name)}</b><br><small>${esc(s.mobile||'')} ${esc(s.address||'')}</small></div>`).join('')+`<button class="btn" onclick="addSupplier()">+ নতুন পার্টি</button>`)}function addSupplier(){modal('নতুন পার্টি',`<input id="sn" placeholder="পার্টির নাম"><br><br><input id="sm" placeholder="মোবাইল"><br><br><input id="sa" placeholder="ঠিকানা"><br><br><button class="btn" onclick="db.suppliers.push({id:Date.now(),name:sn.value,mobile:sm.value,address:sa.value,due:0});save();closeModal();toast('পার্টি যোগ হয়েছে')">সংরক্ষণ</button>`)}function addPurchase(){if(!db.products.length)return toast('আগে পণ্য যোগ করুন');modal('নতুন ক্রয়',`<select id="pp">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><br><br><input id="pq" type="number" placeholder="পরিমাণ"><br><br><input id="pr" type="number" placeholder="ক্রয়মূল্য/ইউনিট"><br><br><button class="btn" onclick="let p=db.products.find(x=>x.id==pp.value),q=Number(pq.value),r=Number(pr.value);if(q>0){p.stock+=q;p.cost=r;db.purchases.push({id:Date.now(),product:p.name,qty:q,price:r,total:q*r,date:new Date().toISOString()});save();closeModal();toast('ক্রয় সংরক্ষণ হয়েছে');render('products')}">সংরক্ষণ</button>`)}function addExpense(){modal('নতুন খরচ',`<input id="ea" type="number" placeholder="টাকার পরিমাণ"><br><br><input id="en" placeholder="নোট"><br><br><button class="btn" onclick="let a=Number(ea.value);if(a>0){db.expenses.push({id:Date.now(),amount:a,note:en.value,date:new Date().toISOString()});save();closeModal();toast('খরচ সংরক্ষণ হয়েছে')}">সংরক্ষণ</button>`)}function report(){let t=totals();modal('রিপোর্ট',`<div class="grid"><div class="card">বিক্রি<br><b>${money(t.sales)}</b></div><div class="card">ক্রয়<br><b>${money(t.purchases)}</b></div><div class="card">খরচ<br><b>${money(t.expenses)}</b></div><div class="card">লাভ<br><b class="green">${money(t.profit)}</b></div></div>`)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='muktijoddha-store-backup.json';a.click()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>render(n.dataset.page));render('home');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));</script></body></html>
